[package]
name = "okr"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Vendoring and reproducibility for R source context used by AI coding agents"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/nanxstats/okr"
documentation = "https://docs.rs/okr"
keywords = ["r", "reproducibility", "vendoring", "ai", "agents"]
categories = ["command-line-utilities", "development-tools"]
authors = ["Nan Xiao <me@nanx.me>"]
exclude = [
    "AGENTS.md",
    "vendor/",
    "pyproject.toml",
    "uv.lock",
    ".python-version",
    "site/",
    "docs/",
    "zensical.toml",
]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
flate2 = "1"
globset = "0.4"
indicatif = "0.18"
reqwest = { version = "0.13", default-features = false, features = [
    "blocking",
    "json",
    "rustls",
] }
serde = { version = "1", features = ["derive"] }
# JSON is the specified manifest and machine-output encoding; serde itself
# deliberately does not provide a JSON codec.
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
tempfile = "3"
thiserror = "2"
toml = "0.9"
toml_edit = "0.23"
walkdir = "2"
xshell = "0.2"
zstd = "0.13"

[dev-dependencies]
assert_cmd = "2"
insta = { version = "1", features = ["json", "redactions"] }
predicates = "3"
proptest = "1"
