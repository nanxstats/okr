[package]
name = "okr"
version = "0.1.6"
edition = "2024"
rust-version = "1.88"
description = "Reproducible R source context for coding agents"
license = "MIT"
readme = "README.md"
repository = "https://github.com/nanxstats/okr"
documentation = "https://nanx.me/okr/"
keywords = ["r", "reproducibility", "vendoring", "ai", "agents"]
categories = ["command-line-utilities", "development-tools"]
authors = ["Nan Xiao <me@nanx.me>"]
exclude = [
    "AGENTS.md",
    "SPEC.md",
    "vendor/",
    "pyproject.toml",
    "uv.lock",
    ".python-version",
    "site/",
    "docs/",
    "zensical.toml",
]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
flate2 = "1.1.9"
globset = "0.4.20"
indicatif = "0.18.6"
reqwest = { version = "0.13.4", default-features = false, features = [
    "blocking",
    "json",
    "rustls",
] }
serde = { version = "1.0.229", features = ["derive"] }
# JSON is the specified manifest and machine-output encoding; serde itself
# deliberately does not provide a JSON codec.
serde_json = "1.0.151"
sha2 = "0.11.0"
tar = "0.4.46"
tempfile = "3.27.0"
thiserror = "2.0.20"
toml = "1.1.4"
toml_edit = "0.25.13"
walkdir = "2.5.0"
xshell = "0.2.7"
zstd = "0.13.3"

[dev-dependencies]
assert_cmd = "2.2.2"
insta = "1.48.0"
predicates = "3.1.4"
